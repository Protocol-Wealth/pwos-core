name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, Typecheck, Test, Lint
    runs-on: ubuntu-latest
    # Disposable database for packages/audit-log append-only trigger tests.
    # The password is a CI-only value for this empty database, not a secret.
    env:
      AUDIT_LOG_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/audit_log_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_log_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audit_log_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version constants
        run: pnpm versions:check

      - name: Build all packages
        run: pnpm -r build

      - name: Check publish shape
        run: pnpm lint:publish

      - name: Typecheck all packages
        run: pnpm -r typecheck

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Test all packages
        run: pnpm -r test

      - name: Lint all packages
        run: pnpm -r lint
