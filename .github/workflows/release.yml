name: Release (version PR only)

# Publishing is done LOCALLY by the maintainer (`npm login` + `pnpm
# changeset:version` + `pnpm changeset:publish`) per the firm's convention —
# the `NPM_API_KEY` CI secret is intentionally unused. This workflow's ONLY
# job is to keep a "Version Packages" PR open that aggregates queued
# changesets, so pending releases are visible. It does NOT publish to npm.
#
# (History: the prior version also ran `changeset:publish` in CI; that step
# failed on every run because the npm auth path is local-only, which made a
# routine red run look like a broken publish. Trimmed to version-PR-only.)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-pr:
    name: Version PR
    runs-on: ubuntu-latest
    # Do not run on the auto-generated changeset version-PR commits to avoid
    # an infinite loop when the bot's PR is merged back to main.
    if: github.repository == 'Protocol-Wealth/pwos-core'
    # Same disposable database as ci.yml. packages/audit-log's TRUNCATE tests
    # fail closed when CI is set and this URL is missing, which skips the
    # Version Packages step. The password is a CI-only value for this empty
    # database, not a secret.
    env:
      AUDIT_LOG_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/audit_log_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audit_log_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audit_log_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required so changesets can read git tags + push the version PR.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run tests
        run: pnpm -r test

      - name: Open / update the Version Packages PR
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # version-only: with no publish-script input, changesets/action opens
          # or updates the Version Packages pull request when changesets are
          # pending and does nothing when there are none. It never publishes
          # to npm. That remains the maintainer's local pnpm changeset:publish.
          # v2 renamed version, commit, and title. push-with-git-cli keeps the
          # git push this workflow was written for.
          # changeset:version also refreshes pnpm-lock.yaml. The mcp-tools minor
          # rewrites onchain-accounting-contract's workspace:^ range, and a stale
          # lockfile specifier fails `pnpm install --frozen-lockfile`.
          version-script: pnpm changeset:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          push-with-git-cli: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
