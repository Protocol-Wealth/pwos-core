name: License Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license-scan:
    name: Scan dependency licenses
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install license-checker
        run: npm install -g license-checker-rseidelsohn

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan licenses
        id: scan
        run: |
          license-checker-rseidelsohn --json --out dependency-licenses.json --production
          license-checker-rseidelsohn --summary --production > dependency-licenses-summary.txt
          cat dependency-licenses-summary.txt

      - name: Check for forbidden licenses
        run: |
          node -e "
          const fs = require('fs');
          const licenses = JSON.parse(fs.readFileSync('dependency-licenses.json', 'utf8'));
          const forbidden = ['GPL-3.0', 'AGPL-3.0', 'SSPL-1.0'];
          const violations = [];
          for (const [name, info] of Object.entries(licenses)) {
            const license = info.licenses || '';
            if (forbidden.some(fb => license.includes(fb))) {
              violations.push(\`\${name}: \${license}\`);
            }
          }
          if (violations.length > 0) {
            console.error('❌ FORBIDDEN LICENSES DETECTED:');
            violations.forEach(v => console.error('  - ' + v));
            process.exit(1);
          }
          console.log(\`✅ All \${Object.keys(licenses).length} dependencies pass license check\`);
          "

      - name: Upload license report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-report
          path: |
            dependency-licenses.json
            dependency-licenses-summary.txt
